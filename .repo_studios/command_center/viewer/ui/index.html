<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Progressive Detail Mermaid Viewer</title>
    <link rel="stylesheet" href="viewer.css" />
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  </head>
  <body>
    <div id="app" class="viewer-app">
      <header class="viewer-header">
        <h1>Progressive Detail Mermaid Viewer</h1>
        <div class="viewer-header-actions">
          <button id="refresh-button" type="button">Refresh</button>
          <button id="export-button" type="button" disabled>Export .mmd</button>
        </div>
      </header>
      <section class="viewer-body">
        <aside class="viewer-sidebar" aria-label="Selector">
          <h2 class="sidebar-title">CommandView Artifacts</h2>
          <ul id="selector-list" class="selector-list" aria-live="polite"></ul>
          <h2 class="sidebar-title">Zoom Levels</h2>
          <div id="level-controls" class="level-controls" role="group" aria-label="Zoom levels">
            <div id="level-buttons" class="level-buttons"></div>
            <ul id="level-sidebar" class="selector-list level-list" aria-live="polite"></ul>
          </div>
          <h2 class="sidebar-title">View Packs</h2>
          <div id="view-pack-container" class="view-pack-container" aria-live="polite"></div>
        </aside>
        <main class="viewer-main">
          <nav id="breadcrumb" class="breadcrumb" aria-label="Zoom breadcrumb"></nav>
          <div id="diagram-container" class="diagram-container" aria-live="polite">
            <div id="diagram" class="diagram" role="img" aria-label="Mermaid diagram output"></div>
          </div>
          <section class="viewer-status" aria-live="polite" id="status-panel"></section>
        </main>
      </section>
    </div>
    <script src="viewer.js"></script>
  </body>
</html>
