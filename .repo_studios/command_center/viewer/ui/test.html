<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer Test</title>
    <style>
        body {
            background: #1e1e1e;
            color: #cccccc;
            font-family: monospace;
            padding: 20px;
        }
        .test { 
            background: #252526;
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #007acc;
        }
        .pass { border-left-color: #89d185; }
        .fail { border-left-color: #f48771; }
    </style>
</head>
<body>
    <h1>Viewer Loading Test</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function addTest(name, passed, details) {
            const div = document.createElement('div');
            div.className = 'test ' + (passed ? 'pass' : 'fail');
            div.innerHTML = `<strong>${passed ? '✓' : '✗'} ${name}</strong><br>${details}`;
            results.appendChild(div);
        }
        
        // Test 1: Basic JavaScript
        addTest('JavaScript Executing', true, 'This test page is running');
        
        // Test 2: Check if CSS file exists
        fetch('viewer.css')
            .then(r => addTest('viewer.css exists', r.ok, `Status: ${r.status}`))
            .catch(e => addTest('viewer.css exists', false, e.message));
        
        // Test 3: Check if JS file exists
        fetch('viewer.js')
            .then(r => addTest('viewer.js exists', r.ok, `Status: ${r.status}`))
            .catch(e => addTest('viewer.js exists', false, e.message));
        
        // Test 4: Check Mermaid CDN
        fetch('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js')
            .then(r => addTest('Mermaid CDN accessible', r.ok, `Status: ${r.status}`))
            .catch(e => addTest('Mermaid CDN accessible', false, e.message));
        
        // Test 5: Try loading viewer.js as module
        import('./viewer.js')
            .then(() => addTest('viewer.js loads as module', true, 'Module loaded successfully'))
            .catch(e => addTest('viewer.js loads as module', false, e.message));
        
        // Test 6: Check window.viewerConfig
        setTimeout(() => {
            const hasConfig = typeof window.viewerConfig !== 'undefined';
            addTest('window.viewerConfig', hasConfig, hasConfig ? JSON.stringify(window.viewerConfig) : 'Not defined');
        }, 100);
    </script>
</body>
</html>
