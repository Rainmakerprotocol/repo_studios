# Tier-3: generate_undocumented_logic_report.py
# Producer script that identifies undocumented functions, classes, and methods.

tool:
  id: generate_undocumented_logic_report
  name: Generate Undocumented Logic Report
  description: |
    Scans automation code for functions, classes, and methods lacking docstrings.
    Correlates findings against the doc index and anchor inventory to identify
    code that lacks both inline documentation and external documentation references.

    Emits a canonical HealthView bundle under:

      .repo_studios/reports/healthview/producer_reports/undocumented_logic/<YYYYMMDD-HHMM>/

    The bundle includes manifest.json, summary.md, and telemetry.json.

    This producer helps maintain documentation coverage by flagging code entities
    that are missing docstrings and have no associated documentation anchors.

    Exit codes:
      0 - success (report generated, may contain findings)
      1 - error (missing inputs or parsing failures)
  keywords:
    - healthview
    - producer
    - docstrings
    - documentation
    - coverage
    - analysis
    - modules
    - functions
    - classes
  use_when:
    - Need to identify undocumented code entities
    - Checking docstring coverage before releases
    - Finding code that needs documentation attention
    - Producing undocumented logic telemetry for downstream aggregators
  dont_use_when:
    - You only need to inventory documentation (use generate_doc_index.py)
    - You need to detect code/doc churn (use generate_code_doc_churn_report.py)

invocation:
  command_template: |
    python {script_path} \
      --repo-root {repo_root} \
      --output-dir {output_dir} \
      --doc-index {doc_index} \
      --anchor-inventory {anchor_inventory} \
      --allowlist {allowlist} \
      --code-root {code_root} \
      --include-command-center \
      --artifacts-to-keep {artifacts_to_keep} \
      --log-level {log_level}
  script_path: .repo_studios/scripts/producers/generate_undocumented_logic_report.py
  importable: true
  entry_function: run
  environment:
    requires_venv: true
    python_version: ">=3.11"
    notes:
      - "Uses shared libraries from .repo_studios/command_center/scripts/libraries/"
      - "Entry point is run(argv) — orchestrators can import and call directly"
      - "Parses Python AST to detect missing docstrings"

parameters:
  - name: repo_root
    type: path
    required: false
    default: null
    description: Repository root override (defaults to project root resolution).
    validation:
      must_exist: true
      must_be: directory

  - name: output_dir
    type: path
    required: false
    default: .repo_studios/reports/healthview/producer_reports/undocumented_logic
    description: |
      HOP-compliant output directory. The producer appends <timestamp>/ automatically.
    validation:
      must_exist: false
      will_create: true

  - name: doc_index
    type: path
    required: false
    default: ".repo_studios/reports/healthview/producer_reports/doc_index"
    description: |
      Path to latest doc index telemetry directory. The script will find
      the most recent telemetry.json within this topic directory.
    validation:
      must_exist: false

  - name: anchor_inventory
    type: path
    required: false
    default: ".repo_studios/reports/healthview/producer_reports/anchor_inventory"
    description: |
      Path to latest anchor inventory telemetry directory. The script will
      find the most recent telemetry.json within this topic directory.
    validation:
      must_exist: false

  - name: allowlist
    type: path
    required: false
    default: ".repo_studios/config/undocumented_logic_allowlist.txt"
    description: |
      Path to module allowlist file (one module per line). Modules in
      this list will be excluded from undocumented logic reporting.
    validation:
      must_exist: false

  - name: code_root
    type: path
    required: false
    default: null
    repeatable: true
    description: |
      Path(s) to scan for Python code. Can be specified multiple times.
      Defaults to .repo_studios/scripts if not specified.

  - name: include_command_center
    type: boolean
    required: false
    default: false
    description: |
      When set, also scans .repo_studios/command_center/scripts for
      undocumented code entities.

  - name: artifacts_to_keep
    type: integer
    required: false
    default: 1
    description: Number of historical run directories to retain after pruning.
    validation:
      minimum: 1

  - name: log_level
    type: string
    required: false
    default: "INFO"
    description: Logging verbosity level.
    validation:
      allowed_values:
        - DEBUG
        - INFO
        - WARNING
        - ERROR
        - CRITICAL

io_contract:
  inputs:
    - name: doc_index_telemetry
      source: filesystem
      path_pattern: ".repo_studios/reports/healthview/producer_reports/doc_index/<latest>/telemetry.json"
      description: Doc index telemetry with document inventory.
      required: false

    - name: anchor_inventory_telemetry
      source: filesystem
      path_pattern: ".repo_studios/reports/healthview/producer_reports/anchor_inventory/<latest>/telemetry.json"
      description: Anchor inventory telemetry with heading anchors.
      required: false

    - name: python_source_files
      source: filesystem
      path_pattern: "{code_root}/**/*.py"
      description: Python source files to scan for undocumented entities.
      required: true

    - name: allowlist
      source: filesystem
      path_pattern: ".repo_studios/config/undocumented_logic_allowlist.txt"
      description: Optional module allowlist for exclusions.
      required: false

  outputs:
    - artifact: manifest.json
      path_pattern: "{output_dir}/<YYYYMMDD-HHMM>/manifest.json"
      format: json
      schema_version: 1
      description: Run metadata including inputs, outputs catalog, and status.

    - artifact: summary.md
      path_pattern: "{output_dir}/<YYYYMMDD-HHMM>/summary.md"
      format: markdown
      description: Human-readable summary of undocumented logic findings.

    - artifact: telemetry.json
      path_pattern: "{output_dir}/<YYYYMMDD-HHMM>/telemetry.json"
      format: json
      description: Structured telemetry for downstream aggregators.

  side_effects:
    - type: directory_pruning
      description: |
        Historical run directories beyond artifacts_to_keep are removed
        from the topic directory.

behavior:
  exit_codes:
    - exit_code: 0
      meaning: Success, report generated (may contain undocumented logic findings)
      agent_action: Review summary.md for entities needing docstrings

    - exit_code: 1
      meaning: Error (missing inputs, parsing failures, or invalid configuration)
      agent_action: Check error messages and verify prerequisites

  stderr_patterns:
    - pattern: "Modules with undocumented logic"
      meaning: Some code entities are missing docstrings
      agent_action: Review listed modules and add docstrings

    - pattern: "entities_missing_docs"
      meaning: Count of functions/classes/methods lacking documentation
      agent_action: Prioritize entities with high visibility

integration:
  typical_workflow:
    - Run generate_doc_index.py to create doc index telemetry
    - Run generate_anchor_inventory.py to create anchor inventory
    - Run generate_undocumented_logic_report.py to analyze coverage
    - Review summary.md for entities needing documentation attention

  output_consumers:
    - aggregate_docs_health_signals.py

  input_producers:
    - generate_doc_index.py
    - generate_anchor_inventory.py

  sample_output: |
    {
      "schema_version": 1,
      "viewer_slug": "healthview",
      "topic": "undocumented_logic",
      "run_timestamp": "20251230-1457",
      "generated_at": "2025-12-30T14:57:00+00:00",
      "status": "ok",
      "summary": {
        "modules_scanned": 42,
        "modules_with_findings": 39,
        "entities_missing_docs": 156,
        "docstring_coverage_percent": 72.5
      },
      "catalog": [
        {"artifact": "manifest.json", "path": "..."},
        {"artifact": "summary.md", "path": "..."},
        {"artifact": "telemetry.json", "path": "..."}
      ]
    }

examples:
  - description: Basic undocumented logic scan
    command: |
      python .repo_studios/scripts/producers/generate_undocumented_logic_report.py \
        --log-level INFO
    expected_output: |
      INFO Modules with undocumented logic: 39

  - description: Full run with command center inclusion
    command: |
      python .repo_studios/scripts/producers/generate_undocumented_logic_report.py \
        --repo-root . \
        --output-dir .repo_studios/reports \
        --include-command-center \
        --artifacts-to-keep 1 \
        --log-level INFO

  - description: Programmatic invocation from Python
    code: |
      from generate_undocumented_logic_report import run
      result = run([
          "--output-dir", ".repo_studios/reports",
          "--include-command-center",
          "--log-level", "INFO",
      ])
      print(f"Status: {result['status']}")
      print(f"Entities missing docs: {result['summary']['entities_missing_docs']}")

tier3:
  allowed: true
  reason: |
    Mature producer with stable CLI, HOP-compliant output, and well-defined
    io_contract. Safe for agent-driven execution in documentation analysis workflows.

metadata:
  category: producer
  tier: tier-3
  status: active
  version: 1.0.0
  last_updated: "2025-12-30"
  author: repo_studios_team
  dependencies_tier3:
    - tier3_cli.yaml
    - tier3_artifacts.yaml
    - tier3_prune_logs.yaml
    - tier3_generate_doc_index.yaml
    - tier3_generate_anchor_inventory.yaml
  tier2_rosters:
    - tier2_docs_health_overview_roster.md
  tier1_pipelines:
    - tier1_healthview_orchestration_pipeline.md
