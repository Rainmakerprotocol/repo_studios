    - tier3_generate_doc_index.yaml
    - tier3_generate_anchor_inventory.yaml
    - tier3_validate_markdown_anchors.yaml
    - tier3_verify_docs_integrity.yaml
    - tier3_validate_metrics_anchor_stubs.yaml
