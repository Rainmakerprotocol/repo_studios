# Tier-3: generate_test_coverage_inventory.py
# Producer script that converts a Coverage.py XML payload into a HealthView bundle.

tool:
  id: generate_test_coverage_inventory
  name: Generate Test Coverage Inventory
  description: |
    Ingests a Coverage.py XML report, correlates executed lines with Python functions in the repo,
    and emits a canonical HealthView bundle under:

      .repo_studios/reports/healthview/producer_reports/test_coverage_inventory/<YYYYMMDD-HHMM>/

    The bundle includes manifest.json, summary.md, and telemetry.json.

    This producer can optionally regenerate the coverage XML (pytest + pytest-cov + coverage.py)
    via --refresh-coverage-xml. The canonical operator/agent entrypoint for this mode is:

      make -C .repo_studios studio-generate-test-coverage-inventory LOG_LEVEL=INFO
  keywords:
    - healthview
    - producer
    - coverage
    - telemetry
    - inventory
    - xml
  use_when:
    - Need a deterministic, timestamped coverage inventory bundle (manifest/summary/telemetry)
    - Validating Stage 1.1 coverage inventory outputs and retention behavior
    - Producing coverage telemetry for downstream topic orchestrators/summarizers
  dont_use_when:
    - You only need overall project coverage gating inside CI (prefer CI-native coverage checks)
    - You do not have a Coverage.py XML report available

invocation:
  command_template: |
    python {script_path} \
      --repo-root {repo_root} \
      --coverage-xml {coverage_xml} \
      --output-dir {output_dir} \
      --timestamp {timestamp} \
      --artifacts-to-keep {artifacts_to_keep} \
      --log-level {log_level}
  script_path: .repo_studios/scripts/producers/generate_test_coverage_inventory.py
  importable: true
  entry_function: run
  environment:
    requires_venv: true
    python_version: ">=3.11"
    notes:
      - "--refresh-coverage-xml requires pytest, pytest-cov, and coverage to be installed in the active venv."

parameters:
  - name: repo_root
    type: path
    required: false
    default: "."
    description: Repository root for resolving repo-relative paths.

  - name: coverage_xml
    type: path
    required: false
    default: .repo_studios/tests/fixtures/test_run_coverage/coverage.xml
    description: Coverage.py XML input payload.
    validation:
      must_exist: true
      must_be_file: true

  - name: refresh_coverage_xml
    type: bool
    required: false
    default: false
    description: |
      Regenerate the coverage XML by running pytest with coverage before building the inventory.
      This is intended for agent-friendly one-shot execution.

  - name: refresh_tests
    type: string
    required: false
    default: .repo_studios/tests
    description: |
      Test suites/paths passed to pytest when refresh_coverage_xml is true.
      Multiple suites are supported by repeating the CLI flag: --refresh-tests <suite1> <suite2> ...

  - name: refresh_continue_on_error
    type: bool
    required: false
    default: false
    description: |
      When refresh_coverage_xml is true, continue generating the bundle even if pytest exits non-zero.
      Refresh failures are captured in manifest.json inputs (refresh_exit_code, refresh_suite_results).

  - name: refresh_omit_tests
    type: bool
    required: false
    default: false
    description: |
      When refresh_coverage_xml is true, omit */tests/* paths from coverage measurement.
      This does not change which tests are executed.

  - name: refresh_cov_target
    type: string
    required: false
    default: .repo_studios
    description: |
      Coverage targets passed to pytest-cov via --cov=<target> when refresh_coverage_xml is true.
      Multiple targets are supported by repeating the CLI flag.

  - name: refresh_pytest_args
    type: string
    required: false
    default: null
    description: |
      Additional args passed to pytest when refresh_coverage_xml is true.
      This must appear last on the command line (argparse REMAINDER).

  - name: output_dir
    type: path
    required: false
    default: .repo_studios/reports/healthview
    description: HealthView root where bundles are written.
    validation:
      parent_must_exist: false

  - name: timestamp
    type: string
    required: false
    default: "current UTC"
    description: ISO-8601 timestamp (naive timestamps are treated as UTC).

  - name: artifacts_to_keep
    type: int
    required: false
    default: 5
    description: Number of historical run directories to retain.
    validation:
      min_value: 1

  - name: min_coverage
    type: float
    required: false
    default: null
    description: Optional overall coverage threshold gate (0-100).

  - name: include_empty
    type: bool
    required: false
    default: false
    description: Include files with zero detected functions in the report.

  - name: log_level
    type: enum
    required: false
    default: INFO
    choices: [DEBUG, INFO, WARNING, ERROR, CRITICAL]

outputs:
  primary:
    type: directory
    format: healthview_bundle
    path_pattern: ".repo_studios/reports/healthview/producer_reports/test_coverage_inventory/<YYYYMMDD-HHMM>/"
    description: HealthView bundle directory for a single run.
    contents:
      required:
        - manifest.json
        - summary.md
        - telemetry.json

  secondary:
    - type: stdout
      format: text
      description: Logging output describing coverage extraction and bundle creation.

behavior:
  idempotent: false
  side_effects:
    - Reads the coverage XML report from coverage_xml
    - When refresh_coverage_xml is enabled, executes pytest (one invocation per refresh_tests entry) and renders a combined coverage XML report
    - Reads repository source files to build function boundaries
    - Writes a timestamped HealthView bundle directory
    - Prunes older sibling run directories beyond artifacts_to_keep
  duration_estimate: "1-5 seconds for ingestion-only; refresh mode depends on pytest runtime"
  blocking: true
  mutates_repo: false
  mutates_filesystem: true

error_handling:
  common_errors:
    - exit_code: 1
      meaning: "Coverage XML missing, or coverage below --min-coverage threshold (bundle may still be written)."
      agent_action: "Confirm --coverage-xml exists or run with --refresh-coverage-xml; review summary.md and telemetry.json for details."

    - exit_code: 2
      meaning: "Invalid CLI inputs (for example, --min-coverage outside 0-100)."
      agent_action: "Fix the input validation error and retry."

    - exit_code: "non-zero"
      meaning: "pytest failures during refresh mode when --refresh-continue-on-error is not enabled."
      agent_action: "Re-run with --refresh-continue-on-error (or use the Make target) and inspect manifest.json inputs.refresh_suite_results."

  stderr_patterns:
    - pattern: "ModuleNotFoundError"
      meaning: "Missing runtime dependency (commonly coverage/pytest-cov when using refresh mode)."
      agent_action: "Ensure the active venv has pytest, pytest-cov, and coverage installed."

    - pattern: "No coverage data collected"
      meaning: "coverage.py could not render XML (no data recorded)."
      agent_action: "Verify refresh_tests executes tests and that pytest-cov is configured; re-run without omit-tests to debug."

integration:
  typical_workflow:
    - step: 1
      action: Run the canonical Make target (refresh + bundle)
      command: make -C .repo_studios studio-generate-test-coverage-inventory LOG_LEVEL=INFO
      output: HealthView bundle under producer_reports/test_coverage_inventory

    - step: 2
      action: Review summary.md and telemetry.json
      consumes: producer_reports/test_coverage_inventory bundle

  input_producers:
    - Coverage.py XML report generated externally (e.g., CI) OR via this tool's refresh mode
    - make -C .repo_studios studio-generate-test-coverage-inventory (recommended)

  output_consumers:
    - .repo_studios/command_center/scripts/orchestrators/run_test_execution_telemetry.py

examples:
  - description: Standard run using defaults
    command: |
      python .repo_studios/scripts/producers/generate_test_coverage_inventory.py --log-level INFO

  - description: Canonical agent/operator entrypoint (refresh coverage + emit bundle)
    command: |
      make -C .repo_studios studio-generate-test-coverage-inventory LOG_LEVEL=INFO

  - description: Refresh coverage XML then emit bundle (CLI form)
    command: |
      python .repo_studios/scripts/producers/generate_test_coverage_inventory.py \
        --repo-root . \
        --coverage-xml .repo_studios/tmp_cli_probe/coverage_repo.xml \
        --refresh-coverage-xml \
        --refresh-tests .repo_studios/tests \
        --refresh-cov-target . \
        --refresh-omit-tests \
        --refresh-continue-on-error \
        --output-dir .repo_studios/reports/healthview \
        --artifacts-to-keep 5 \
        --log-level INFO

  - description: Deterministic run slug for validation
    command: |
      python .repo_studios/scripts/producers/generate_test_coverage_inventory.py \
        --timestamp 2025-12-01T01:01:00+00:00 \
        --log-level DEBUG

metadata:
  category: producer
  tier: 3
  status: draft
  version: 0.2.0
  author: Repo Studios Team
  last_updated: 2025-12-27
  dependencies_tier3:
    - tier3_artifacts.yaml
    - tier3_cli.yaml
    - tier3_prune_logs.yaml
    - tier3_database_integration.yaml
  tier2_rosters:
    - healthview_orchestration_pipeline/tier2_roster/tier2_test_execution_telemetry_roster.md
  tier1_pipelines:
    - healthview_orchestration_pipeline/tier1_healthview_orchestration_pipeline.md
  testing:
    test_file: .repo_studios/tests/tests_producers/test_generate_test_coverage_inventory.py
