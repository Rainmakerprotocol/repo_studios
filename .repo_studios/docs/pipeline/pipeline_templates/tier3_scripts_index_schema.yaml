  # ... remaining dependency relationships

# ============================================
# VALIDATION REPORT (Optional)
# Tracks health of tier3 documentation
# ============================================
validation:
  # Scripts without tier3 YAML files
  missing_tier3_docs:
    - script_path: ".repo_studios/scripts/utilities/some_undocumented_script.py"
      category: "utility"
      detected: true
  
  # tier3 YAML files without corresponding scripts
  orphaned_tier3_docs:
    - tier3_file: "tier3_deprecated_script.yaml"
      reason: "Script deleted but YAML remains"
  
  # tier3 YAML files with validation errors
  validation_errors:
    - tier3_file: "tier3_broken_script.yaml"
      errors:
        - "Missing required field: tool.id"
        - "Invalid category: 'analyzer' (must be one of: producer, consumer, aggregator, orchestrator, summarizer, utility)"

# ============================================
# USAGE NOTES FOR AGENTS
# ============================================
# Agent Workflow:
# 1. Load tier3_scripts_index.yaml (this file)
# 2. Search 'scripts' array by keywords or category
# 3. Identify relevant script_id
# 4. Load specific tier3_<script_id>.yaml for full details
# 5. Use invocation.command_template to execute
# 
# Example Query:
# "I need to scan Python files for functions"
# → Search keywords: ["scan", "functions"]
# → Find: generate_commandview_inventory
# → Load: tier3_generate_commandview_inventory.yaml
# → Execute: python .repo_studios/scripts/producers/generate_commandview_inventory.py --target <path>
# ============================================
