# ============================================
scripts:
  # Each entry provides just enough info for discovery
  - script_id: "generate_commandview_inventory"
    name: "CommandView Inventory Generator"
    category: "producer"
    tier3_file: "tier3_generate_commandview_inventory.yaml"
    script_path: ".repo_studios/scripts/producers/generate_commandview_inventory.py"
    summary: "Scans Python scripts to extract functions and generate structured JSON inventory"
    keywords: ["inventory", "scan", "functions", "analyze"]
    status: "active"
    entry_point: "run"
    importable: true
  
  - script_id: "generate_function_analysis"
    name: "Function Analysis Generator"
    category: "summarizer"
    tier3_file: "tier3_generate_function_analysis.yaml"
    script_path: ".repo_studios/scripts/summarizers/generate_function_analysis.py"
    summary: "Analyzes function complexity, generates metrics and insights"
    keywords: ["analysis", "complexity", "metrics", "functions"]
    status: "active"
    entry_point: "run"
    importable: true
  
  - script_id: "scan_duplicates"
    name: "Duplicate Code Scanner"
    category: "aggregator"
    tier3_file: "tier3_scan_duplicates.yaml"
    script_path: ".repo_studios/scripts/aggregators/scan_duplicates.py"
    summary: "Detects duplicate functions across codebase using similarity analysis"
    keywords: ["duplicates", "similarity", "refactor", "analysis"]
    status: "active"
    entry_point: "run"
    importable: true
  
  # Add remaining 74 scripts here...
