---
project_name: "Jarvis Function Inventory System"
project_purpose: "Speed up Copilot function discovery and provide structural documentation treasure trove"
created_date: "2025-10-23"
status: "Phase 0 - Planning"

# ============================================================================
# DESIGN PRINCIPLES
# ============================================================================
design_principles:
  - principle: "Co-located Documentation"
    description: "Indices live alongside the code they document, not in centralized location"
    
  - principle: "Treasure Trove Philosophy"
    description: "Indices are first-class documentation committed to repo for AI and human benefit"
    
  - principle: "Manual Control"
    description: "Developer triggers indexing on-demand via make command, not automatic"
    
  - principle: "Certainty Over Convention"
    description: "Full paths specified explicitly to eliminate ambiguity"
    
  - principle: "Atomic Operations"
    description: "Index generation is all-or-nothing with proper error handling"

# ============================================================================
# ARCHITECTURE OVERVIEW
# ============================================================================
architecture:
  trigger_mechanism: "Makefile target with path parameter"
  command_pattern: "make index path=<folder_path>"
  output_location: "Co-located <folder_name>_index/ directory"
  output_filename: "<folder_name>_index.json"
  version_control: "Committed to git as documentation artifact"
  
  example_usage:
    - command: "make index path=modules/interface"
      output: "modules/interface/interface_index/interface_index.json"
      
    - command: "make index path=agents/diagnostic"
      output: "agents/diagnostic/diagnostic_index/diagnostic_index.json"

# ============================================================================
# PHASE 0: PLANNING & ALIGNMENT
# ============================================================================
phase_0:
  name: "Planning & Alignment"
  status: "COMPLETE"
  objective: "Establish clear requirements and design specifications"
  
  deliverables:
    - name: "inventory_system_phased_plan.yaml"
      description: "This document - complete phased implementation plan"
      location: "docs/"
      
  decisions_made:
    - decision: "Use Makefile for triggering"
      rationale: "Manual control, simple interface, no git overhead"
      
    - decision: "Full path specification"
      rationale: "Eliminates ambiguity about target location"
      
    - decision: "Co-located output"
      rationale: "Index lives near code it documents for locality"
      
    - decision: "Commit indices to repo"
      rationale: "Documentation treasure trove for all consumers"
      
    - decision: "JSON-only format initially"
      rationale: "Solves immediate Copilot speed problem, can add MD/Mermaid later"

  alignment_questions_resolved:
    - question: "Pre-commit or manual?"
      answer: "Manual via Makefile"
      
    - question: "Which formats (JSON/MD/Mermaid)?"
      answer: "JSON first, others later if needed"
      
    - question: "Path handling?"
      answer: "Full explicit paths"
      
    - question: "Output location?"
      answer: "Co-located <folder>_index/ directory"
      
    - question: "Commit or ignore?"
      answer: "Commit as documentation"

# ============================================================================
# PHASE 1: CORE SCRIPT DEVELOPMENT
# ============================================================================
phase_1:
  name: "Core Script Development"
  status: "NOT STARTED"
  objective: "Build the inventory generator script with full functionality"
  
  prerequisites:
    - "Phase 0 complete"
    - "Python 3.8+ available"
    - "AST module understanding"
    
  deliverables:
    - name: "generate_inventory.py"
      description: "Main inventory generation script"
      location: "tools/generate_inventory.py"
      purpose: "Scan Python files, extract structure, generate JSON index"
      
      responsibilities:
        - "Accept folder path as command-line argument"
        - "Validate path exists and is directory"
        - "Recursively scan for .py files"
        - "Parse Python files using AST"
        - "Extract functions, classes, methods, docstrings"
        - "Generate JSON with metadata and statistics"
        - "Create output directory if not exists"
        - "Handle existing index file (remove and replace)"
        - "Write JSON with timestamp"
        - "Report success/failure with details"
        
      error_handling:
        - "Invalid path provided"
        - "Permission errors on file operations"
        - "Malformed Python files (syntax errors)"
        - "Write failures"
        - "Empty directories"
        
      performance_considerations:
        - "Filter out __pycache__, .venv, hidden directories"
        - "Limit recursion depth if needed (future enhancement)"
        - "Stream processing for very large directories"
        - "Progress reporting for long operations"
  
  json_structure:
    metadata:
      fields:
        - "generated_at: ISO timestamp"
        - "folder_path: Full path to scanned folder"
        - "folder_name: Base name of folder"
        - "total_files: Count of Python files scanned"
        - "total_functions: Count of all functions found"
        - "total_classes: Count of all classes found"
        - "scan_depth: 'recursive' indicator"
        
    files:
      description: "Array of file objects"
      file_object:
        fields:
          - "path: Full path to file"
          - "relative_path: Path relative to scanned folder"
          - "line_count: Total lines in file"
          - "functions: Array of function objects"
          - "classes: Array of class objects"
          - "imports: Array of import statements"
          
    function_object:
      fields:
        - "name: Function name"
        - "line: Line number where defined"
        - "type: 'function' literal"
        - "is_async: Boolean for async functions"
        - "is_private: Boolean (starts with _)"
        - "docstring: First line or null"
        
    class_object:
      fields:
        - "name: Class name"
        - "line: Line number where defined"
        - "docstring: First line or null"
        - "methods: Array of method objects (same structure as functions)"
        
    statistics:
      fields:
        - "total_lines_of_code: Sum of all file line counts"
        - "files_by_type: Object mapping extensions to counts"
        - "private_functions: Count"
        - "public_functions: Count"
        - "async_functions: Count"
  
  testing_strategy:
    unit_tests:
      - "Test AST parsing of valid Python file"
      - "Test handling of syntax errors in Python file"
      - "Test function extraction"
      - "Test class and method extraction"
      - "Test private/public/async detection"
      - "Test docstring extraction"
      
    integration_tests:
      - "Test on small sample directory"
      - "Test on nested directory structure"
      - "Test on empty directory"
      - "Test file replacement logic"
      - "Test permission handling"
      
    validation_tests:
      - "Verify JSON structure matches schema"
      - "Verify all files scanned"
      - "Verify function counts accurate"
      - "Verify timestamps valid ISO format"
  
  success_criteria:
    - "Script runs without errors on valid input"
    - "JSON output validates against schema"
    - "All functions and classes captured"
    - "Error handling graceful and informative"
    - "Performance acceptable (<5s for typical folder)"

# ============================================================================
# PHASE 2: MAKEFILE INTEGRATION
# ============================================================================
phase_2:
  name: "Makefile Integration"
  status: "NOT STARTED"
  objective: "Create Makefile target that calls the inventory script"
  
  prerequisites:
    - "Phase 1 complete"
    - "Script tested and validated"
    
  deliverables:
    - name: "Makefile"
      description: "Makefile with index target"
      location: "Makefile (root of Jarvis repo)"
      purpose: "Provide clean interface for running inventory generation"
      
      target_definition:
        name: "index"
        parameters:
          - name: "path"
            required: true
            description: "Folder path to index"
            validation: "Error if not provided"
            
        implementation:
          - "Validate path parameter provided"
          - "Call generate_inventory.py with path argument"
          - "Report success/failure"
          - "Exit with appropriate code"
          
      additional_targets:
        - name: "index-help"
          description: "Display usage instructions"
          
        - name: "index-all-major" 
          description: "Index all major folders (future enhancement)"
          note: "Calls index multiple times for common folders"
  
  usage_examples:
    - command: "make index path=modules/interface"
      description: "Index the interface module"
      
    - command: "make index path=agents"
      description: "Index entire agents directory"
      
    - command: "make index-help"
      description: "Show usage instructions"
  
  error_handling:
    - "Missing path parameter - show usage"
    - "Script execution failure - propagate error"
    - "Invalid path - let script handle and report"
  
  success_criteria:
    - "Makefile target executes script correctly"
    - "Error messages clear and actionable"
    - "Help text informative"
    - "Exit codes appropriate (0=success, 1=error)"

# ============================================================================
# PHASE 3: DOCUMENTATION & GITIGNORE
# ============================================================================
phase_3:
  name: "Documentation & Git Configuration"
  status: "NOT STARTED"
  objective: "Create usage documentation and configure git properly"
  
  prerequisites:
    - "Phase 1 and 2 complete"
    - "System tested end-to-end"
    
  deliverables:
    - name: "INDEX_USAGE.md"
      description: "Complete usage guide for inventory system"
      location: "docs/INDEX_USAGE.md"
      
      sections:
        - section: "Overview"
          content: "System purpose and benefits"
          
        - section: "Quick Start"
          content: "Basic usage examples"
          
        - section: "Command Reference"
          content: "All make targets with examples"
          
        - section: "JSON Structure"
          content: "Explanation of index JSON format"
          
        - section: "Best Practices"
          content: "When to regenerate, workflow tips"
          
        - section: "Troubleshooting"
          content: "Common issues and solutions"
          
        - section: "Integration with Copilot"
          content: "How Copilot uses indices"
    
    - name: ".gitignore updates"
      description: "Ensure indices are committed, not ignored"
      location: ".gitignore"
      
      changes:
        - action: "VERIFY no *_index/ pattern exists"
          rationale: "We want to commit these directories"
          
        - action: "ADD *_index/*.tmp if needed"
          rationale: "Ignore temp files inside index folders"
          
        - action: "ADD *_index/.DS_Store"
          rationale: "Ignore OS metadata files"
    
    - name: ".gitattributes"
      description: "Mark indices as generated documentation"
      location: ".gitattributes (create if not exists)"
      
      content:
        - "*_index/*.json linguist-generated=true"
        - "*_index/*.json linguist-documentation=true"
      
      rationale: "Tell GitHub these are generated docs, not code to analyze"
  
  documentation_standards:
    - "Clear examples for every use case"
    - "Troubleshooting section with real scenarios"
    - "Integration with existing Jarvis protocols"
    - "Links to related documentation"
  
  success_criteria:
    - "Documentation complete and clear"
    - "Git configuration correct"
    - "Examples tested and accurate"
    - "Troubleshooting covers common issues"

# ============================================================================
# PHASE 4: VALIDATION & TESTING
# ============================================================================
phase_4:
  name: "End-to-End Validation"
  status: "NOT STARTED"
  objective: "Validate entire system works in real Jarvis environment"
  
  prerequisites:
    - "Phases 1, 2, 3 complete"
    - "Documentation reviewed"
    
  test_scenarios:
    - scenario: "Index single top-level folder"
      steps:
        - "Run: make index path=modules"
        - "Verify modules/modules_index/modules_index.json created"
        - "Verify JSON structure valid"
        - "Verify all expected files included"
        - "Verify timestamps accurate"
        
    - scenario: "Index nested folder"
      steps:
        - "Run: make index path=modules/interface"
        - "Verify modules/interface/interface_index/ created"
        - "Verify JSON contains correct relative paths"
        
    - scenario: "Regenerate existing index"
      steps:
        - "Generate index first time"
        - "Note timestamp"
        - "Modify a Python file"
        - "Regenerate index"
        - "Verify old file replaced"
        - "Verify new timestamp"
        - "Verify changes reflected"
        
    - scenario: "Handle errors gracefully"
      steps:
        - "Try invalid path"
        - "Verify error message clear"
        - "Try path without permissions"
        - "Verify permission error reported"
        
    - scenario: "Git commit workflow"
      steps:
        - "Generate index"
        - "Run: git status"
        - "Verify index folder shown as new/modified"
        - "Run: git add"
        - "Run: git commit"
        - "Verify commit successful"
        - "Verify index in repository"
  
  copilot_validation:
    - "Generate index for test folder"
    - "Open file in folder"
    - "Test Copilot autocomplete speed"
    - "Compare with/without index"
    - "Measure subjective speed improvement"
  
  performance_benchmarks:
    - metric: "Small folder (5-10 files)"
      target: "<1 second"
      
    - metric: "Medium folder (20-50 files)"
      target: "<3 seconds"
      
    - metric: "Large folder (100+ files)"
      target: "<10 seconds"
  
  success_criteria:
    - "All test scenarios pass"
    - "Error handling works as expected"
    - "Performance meets targets"
    - "Git workflow smooth"
    - "Copilot shows measurable improvement"

# ============================================================================
# PHASE 5: ROLLOUT & INTEGRATION
# ============================================================================
phase_5:
  name: "Production Rollout"
  status: "NOT STARTED"
  objective: "Deploy system to real Jarvis folders and integrate into workflow"
  
  prerequisites:
    - "All previous phases complete"
    - "Validation successful"
    - "Documentation finalized"
    
  rollout_sequence:
    - step: 1
      action: "Index modules/ directory"
      command: "make index path=modules"
      verify: "Check modules/modules_index/modules_index.json"
      
    - step: 2
      action: "Index agents/ directory"
      command: "make index path=agents"
      verify: "Check agents/agents_index/agents_index.json"
      
    - step: 3
      action: "Index services/ directory"
      command: "make index path=services"
      verify: "Check services/services_index/services_index.json"
      
    - step: 4
      action: "Index tools/ directory"
      command: "make index path=tools"
      verify: "Check tools/tools_index/tools_index.json"
      
    - step: 5
      action: "Commit all indices"
      commands:
        - "git add *_index/"
        - "git commit -m 'Add initial function inventories for all major modules'"
      
    - step: 6
      action: "Update project protocols"
      tasks:
        - "Add inventory system to copilot_standards_project.md"
        - "Add to daily workflow documentation"
        - "Update README with index information"
  
  workflow_integration:
    - trigger: "Before major refactoring session"
      action: "Regenerate indices for affected folders"
      
    - trigger: "After adding new modules/files"
      action: "Regenerate parent folder index"
      
    - trigger: "Weekly maintenance (optional)"
      action: "Regenerate all major indices"
      
    - trigger: "Before asking AI for help"
      action: "Ensure relevant indices up to date"
  
  success_criteria:
    - "All major folders indexed"
    - "Indices committed to repo"
    - "Documentation updated"
    - "Workflow integrated smoothly"
    - "Team (you + AI) using indices effectively"

# ============================================================================
# PHASE 6: ENHANCEMENT & ITERATION
# ============================================================================
phase_6:
  name: "Future Enhancements"
  status: "NOT STARTED"
  objective: "Iterate based on usage and add requested features"
  
  prerequisites:
    - "Phase 5 complete"
    - "System in production use for 1+ weeks"
    - "Feedback collected"
    
  potential_enhancements:
    - enhancement: "Markdown output format"
      description: "Generate human-readable .md files alongside JSON"
      trigger: "If you find yourself opening JSON frequently"
      priority: "Medium"
      
    - enhancement: "Mermaid diagram generation"
      description: "Generate visual architecture diagrams"
      trigger: "If you need to visualize structure"
      priority: "Low"
      
    - enhancement: "Incremental updates"
      description: "Only re-scan changed files instead of full regeneration"
      trigger: "If regeneration becomes slow"
      priority: "Medium"
      
    - enhancement: "Dependency graph generation"
      description: "Track which modules import which"
      trigger: "If you need dependency analysis"
      priority: "High"
      
    - enhancement: "Index validation command"
      description: "Check if indices are out of sync with code"
      trigger: "If indices get stale"
      priority: "Medium"
      
    - enhancement: "Batch indexing"
      description: "make index-all to index predefined folders"
      trigger: "If you index same folders repeatedly"
      priority: "High"
      
    - enhancement: "Pre-commit hook option"
      description: "Auto-regenerate on commit (optional)"
      trigger: "If manual regeneration becomes tedious"
      priority: "Low"
      
    - enhancement: "Configuration file"
      description: "YAML config for default folders and options"
      trigger: "If command-line gets complex"
      priority: "Medium"
  
  evaluation_criteria:
    - "Does enhancement solve real pain point?"
    - "Does it fit with existing workflow?"
    - "Is implementation complexity justified?"
    - "Does it maintain system simplicity?"
  
  iteration_process:
    - step: "Collect feedback during usage"
    - step: "Identify pain points or inefficiencies"
    - step: "Prioritize enhancements"
    - step: "Design solution"
    - step: "Implement and test"
    - step: "Update documentation"
    - step: "Deploy and evaluate"

# ============================================================================
# CONSIDERATIONS & CONSTRAINTS
# ============================================================================
considerations:
  technical:
    - consideration: "Python AST parsing"
      impact: "Must handle all valid Python syntax"
      mitigation: "Graceful error handling for malformed files"
      
    - consideration: "File system operations"
      impact: "Must handle permissions and edge cases"
      mitigation: "Comprehensive error handling and validation"
      
    - consideration: "JSON size"
      impact: "Large folders create large JSON files"
      mitigation: "JSON is compact; not a concern for typical folders"
      
    - consideration: "Git merge conflicts"
      impact: "Indices may conflict on merges"
      mitigation: "Regenerate after merge; consider merge strategy"
      
  workflow:
    - consideration: "Manual regeneration required"
      impact: "Indices can become stale"
      mitigation: "Documentation emphasizes when to regenerate"
      
    - consideration: "Learning curve"
      impact: "New command to remember"
      mitigation: "Simple interface; good documentation"
      
  maintenance:
    - consideration: "Script maintenance"
      impact: "May need updates for new Python features"
      mitigation: "Well-structured code; clear documentation"
      
    - consideration: "Index format evolution"
      impact: "May need to change JSON structure"
      mitigation: "Version field in metadata for future compatibility"

# ============================================================================
# DEPENDENCIES & REQUIREMENTS
# ============================================================================
dependencies:
  system:
    - "Python 3.8 or higher"
    - "make utility (standard on Unix/Mac)"
    - "Git (for version control)"
    
  python_libraries:
    - library: "ast"
      purpose: "Parse Python files"
      standard: true
      
    - library: "pathlib"
      purpose: "Path handling"
      standard: true
      
    - library: "json"
      purpose: "JSON generation"
      standard: true
      
    - library: "argparse"
      purpose: "Command-line parsing"
      standard: true
      
    - library: "datetime"
      purpose: "Timestamp generation"
      standard: true
      
  note: "All dependencies are Python standard library - no external packages needed"

# ============================================================================
# RISKS & MITIGATION
# ============================================================================
risks:
  - risk: "Script fails on unusual Python syntax"
    likelihood: "Low"
    impact: "Low"
    mitigation: "Error handling; report file and continue"
    
  - risk: "Index becomes out of sync with code"
    likelihood: "Medium"
    impact: "Low"
    mitigation: "Clear documentation on when to regenerate"
    
  - risk: "Makefile conflicts with existing targets"
    likelihood: "Low"
    impact: "Medium"
    mitigation: "Use unique target name; check before implementation"
    
  - risk: "Performance issues on very large folders"
    likelihood: "Low"
    impact: "Medium"
    mitigation: "Optimize if needed; add progress reporting"
    
  - risk: "User forgets to commit indices"
    likelihood: "Low"
    impact: "Low"
    mitigation: "Indices are next to code; natural to include in commits"

# ============================================================================
# SUCCESS METRICS
# ============================================================================
success_metrics:
  quantitative:
    - metric: "Copilot response time improvement"
      target: "50% faster for function lookups"
      measurement: "Subjective timing before/after"
      
    - metric: "Index generation time"
      target: "<5 seconds for typical folder"
      measurement: "Timed execution"
      
    - metric: "JSON file size"
      target: "<1MB for typical folder"
      measurement: "File size check"
      
  qualitative:
    - metric: "Ease of use"
      target: "Can use without referring to docs after first time"
      
    - metric: "Workflow integration"
      target: "Feels natural; not disruptive"
      
    - metric: "Documentation clarity"
      target: "Can understand system from docs alone"
      
    - metric: "AI collaboration improvement"
      target: "Copilot provides more accurate suggestions"

# ============================================================================
# NEXT ACTIONS
# ============================================================================
next_actions:
  immediate:
    - action: "Review this phased plan"
      owner: "User"
      blocking: true
      
    - action: "Approve or request changes to plan"
      owner: "User"
      blocking: true
      
    - action: "Begin Phase 1 implementation when ready"
      owner: "AI (Claude/Copilot)"
      blocked_by: "User approval"
      
  phase_1_start:
    - action: "Generate generate_inventory.py script"
      owner: "AI"
      deliverable: "Python script with full functionality"
      
    - action: "Test script on sample directory"
      owner: "User"
      deliverable: "Validation results"
      
  ongoing:
    - action: "Maintain alignment using Q&A Protocol"
      owner: "Both"
      frequency: "Continuous"

# ============================================================================
# NOTES & CLARIFICATIONS
# ============================================================================
notes:
  - "This system is designed to be simple and maintainable"
  - "Future enhancements can be added incrementally"
  - "The treasure trove philosophy means indices have long-term value"
  - "Manual triggering gives you control over when indices update"
  - "Co-location keeps documentation near the code it describes"
  - "JSON-first approach solves immediate problem; can expand later"

alignment_confirmation:
  - "User confirmed: Makefile-based manual triggering"
  - "User confirmed: Full path specification with certainty"
  - "User confirmed: Co-located output in <folder>_index/ directories"
  - "User confirmed: Commit indices as treasure trove documentation"
  - "User confirmed: JSON format initially, can add MD/Mermaid later"

protocol_compliance:
  alignment_protocol: "Applied - iterative Q&A to reach consensus"
  qa_protocol: "Applied - one question at a time until certainty achieved"
  project_protocol: "Applied - structured phases with clear gates"
  
professor_notes:
  - "This phased plan demonstrates mature project management"
  - "Clear separation of concerns across phases"
  - "Good risk assessment and mitigation strategies"
  - "Documentation-first approach will pay dividends"
  - "Flexibility built in for future enhancements"
  - "Success metrics are measurable and realistic"
